version: "3.9"

services:
  backend:
    build: ./backend-django
    container_name: django_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend-django:/app
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build: ./frontend-react
    container_name: react_frontend
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    ports:
      - "5173:5173"   # Vite default port
    stdin_open: true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge